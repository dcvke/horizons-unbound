name: Build
on:
  workflow_dispatch:
  push:
    branches: ['main', '1.21.1', '1.20.1']
  pull_request:
    branches: ['main', '1.21.1', '1.20.1']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read Java version
        id: java
        shell: bash
        run: echo "version=$(sed -n 's/^java_version=//p' gradle.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ steps.java.outputs.version }}
          cache: gradle
      - name: Install Java 21 for Gradle and Loom
        if: steps.java.outputs.version != '21'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Build both loaders
        run: bash ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: horizons-unbound-${{ github.head_ref || github.ref_name }}
          path: |
            neoforge/build/libs/*.jar
            forge/build/libs/*.jar
            fabric/build/libs/*.jar
          if-no-files-found: error
