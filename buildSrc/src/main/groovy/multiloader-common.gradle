plugins {
    id 'java-library'
    id 'maven-publish'
}
base { archivesName = "${mod_id}-${project.name}-${minecraft_version}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}
repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.fabricmc.net' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public' }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}
configurations.apiElements.outgoing.capability("$group:$mod_id:$version")
configurations.runtimeElements.outgoing.capability("$group:$mod_id:$version")
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE'))
}

// Optional mods (compat package): Simple Voice Chat's published API, and compile-time stand-ins for JourneyMap's and
// Xaero's classes (compat-stubs/). Neither is packaged: at run time the installed mod supplies the real classes.
sourceSets { compatStubs { java.srcDir rootProject.file('compat-stubs') } }
sourceSets.compatStubs.compileClasspath = configurations.compileClasspath
sourceSets.main.compileClasspath += sourceSets.compatStubs.output
dependencies { compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.5.0' }
